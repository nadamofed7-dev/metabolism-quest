function boom(n){const c=G('cv'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const p=Array.from({length:n},()=>({x:innerWidth/2,y:innerHeight/2,vx:(Math.random()-.5)*14,vy:-Math.random()*14-3,c:`hsl(${Math.random()*360},85%,60%)`,s:5+Math.random()*5}));let f=0;(function r(){x.clearRect(0,0,c.width,c.height);p.forEach(a=>{a.x+=a.vx;a.y+=a.vy;a.vy+=.45;x.fillStyle=a.c;x.fillRect(a.x,a.y,a.s,a.s)});if(++f<80)requestAnimationFrame(r);else x.clearRect(0,0,c.width,c.height)})()}
const RK=[[0,'طالب جديد 🥚'],[150,'مختبِر 🧪'],[400,'بيوكيميائي 🔬'],[800,'خبير نيوكليوتيدات 🧬'],[1500,'بروفيسور 👑']],rank=()=>RK.filter(r=>S.xp>=r[0]).pop()[1];
const OKL=['برافو! 🔥','ذاكرة حديدية! 🧠','ممتاز يا دكتور! 🩺','صح 100%! 🎯'],NOL=['قريب! راجع الحيلة 📖','ركّز على الإنزيم!','الخطأ يعلّمك 💪'];
const bo=()=>L[cur]&&L[cur].boss,hs=()=>(bo()?'❤️'.repeat(H)+'🖤'.repeat(3-H):'')+(cb>1?' 🔥×'+cb:''),upd=()=>{const e=G('ms');if(e)e.innerHTML=hs()};
const hd=()=>`<div class="top"><button class="g" onclick="home()">🏠</button><b>${L[cur].i} ${L[cur].t}</b><span id="ms">${hs()}</span></div>`;
function home(){T.forEach(clearInterval);clearInterval(tm);const n=RK.find(r=>r[0]>S.xp);A.innerHTML=`<div class="top"><h1>🧬 Metabolism Quest</h1><span><button class="g" onclick="mute=!mute;this.textContent=mute?'🔇':'🔊'">${mute?'🔇':'🔊'}</button> <button class="g" onclick="document.documentElement.dataset.theme=document.documentElement.dataset.theme=='dark'?'light':'dark'">🌓</button></span></div><div class="cd">🎖️ <b>${rank()}</b> &nbsp; ⭐ ${stp()} &nbsp; ⚡ ${S.xp} XP<br><span class="mu">${n?`باقي ${n[0]-S.xp} XP للرتبة: ${n[1]}`:'🏆 أعلى رتبة!'}<br>⌨️ على الكمبيوتر: <bdi>1–4</bdi> للاختيار · <bdi>Enter</bdi> للتالي</span></div><button class="b" style="width:100%;margin:4px 0" onclick="fast()">⚡ مراجعة سريعة: صح أم خطأ؟ (10 أسئلة)</button><div class="grid">`+L.map((l,i)=>{const lk=i&&!S.d[i-1];return `<button class="lv" ${lk?'disabled':''} onclick="lvl(${i})"><b>${lk?'🔒':l.i}</b>${i+1}. ${l.t}<br>${'⭐'.repeat(S.d[i]||0)||'&nbsp;'}</button>`}).join('')+'</div>'}
function lvl(i){cur=i;mist=0;H=3;cb=0;L[i].boss?quiz():learn()}
function miss(){mist++;cb=0;upd();if(!bo())return;H--;upd();if(H<1){fail();return 1}}
function fail(){clearInterval(tm);snd(100,.5,'sawtooth');A.innerHTML=hd()+`<div class="cd" style="text-align:center"><div style="font-size:3rem">💔</div><h2>انتهت القلوب!</h2><p class="mu">راجع الحيلة وحاول مجددًا:</p><b>${fx(L[cur].m||'')}</b><p><button class="b" onclick="lvl(${cur})">🔁 أعد المحاولة</button></p></div>`}
function play(){T.forEach(clearInterval);T=[];const bl=[...document.querySelectorAll('.dr.on[data-b]')].map(d=>+d.dataset.b),b=bl.length?Math.min(...bl):99;
document.querySelectorAll('.cell').forEach(c=>{const n=[...c.querySelectorAll('.nd')];n.forEach(x=>x.className='nd');c.querySelectorAll('.mol').forEach(x=>x.remove());const m=document.createElement('i');m.className='mol';m.textContent='🔵';c.appendChild(m);let j=0;
const id=setInterval(()=>{if(j>=n.length||j>=b){if(j>=b&&b<n.length){n[b].classList.add('x');m.textContent='💥';buzz()}else m.textContent='✨';clearInterval(id);return}const e=n[j++];e.classList.add('on');m.style.top=e.offsetTop+e.offsetHeight/2-12+'px';m.style.left=Math.max(2,e.offsetLeft-30)+'px';snd(300+j*60,.08)},650);T.push(id)})}
function pk(j){const l=L[cur],f=l.fl[fk],b=G('c'+j);
if(j==pos){ding();b.style.display='none';G('bd').insertAdjacentHTML('beforeend',(pos?`<div class="ar">⬇ ${f[j][1]||''}</div>`:'')+`<div class="nd on">${f[j][0]}</div>`);S.xp+=5;if(++pos==f.length){boom(40);setTimeout(()=>++fk<l.fl.length?bf():quiz(),1000)}}
else{buzz();b.classList.add('sk');setTimeout(()=>b.classList.remove('sk'),400);miss()}}
function quiz(){const l=L[cur];qs=l.boss?sh(L.flatMap(x=>x.q||[])).slice(0,6):l.q;qi=0;qz()}
function qz(){clearInterval(tm);if(qi>=qs.length)return end();const q=qs[qi],m=q[0].match(/^@(\w+)\|(.*)/);
A.innerHTML=hd()+`<div class="mu">سؤال ${qi+1}/${qs.length}${bo()?' · الأسرع يربح XP إضافي ⏱️</div><div class="tb"><b id="tb"></b></div>':'</div>'}`+(m?ring(m[1]):'')+`<h3>${fx(m?m[2]:q[0])}</h3>`+sh(q.slice(1)).map(o=>`<button class="op" data-c="${o==q[1]?1:0}" onclick="an(this)">${o}</button>`).join('')+'<div id="fb"></div>';
if(bo()){tl=15;tm=setInterval(()=>{tl-=.1;G('tb').style.width=tl/15*100+'%';if(tl<=0)an(null)},100)}}
function an(b){clearInterval(tm);const ok=b&&b.dataset.c=='1';let g=0;document.querySelectorAll('.op').forEach(x=>{x.disabled=1;if(x.dataset.c=='1')x.classList.add('ok')});
if(ok){cb++;g=20+(bo()&&tl>10?10:0)+cb*2;S.xp+=g;ding();boom(25);if(cb==3)toast('🔥 كومبو ×3!');if(cb==5)toast('⚡ كومبو ×5 — لا تتوقف!')}
else{if(b)b.classList.add('no');buzz();if(miss())return}
G('fb').innerHTML=`<div class="guide"><span style="font-size:2rem">🧑‍🔬</span><span>${ok?rnd(OKL)+' +'+g+' XP':b?rnd(NOL):'⏰ انتهى الوقت!'}</span></div>${ok||bo()?'':'<div class="mu" style="margin-bottom:8px">'+fx(L[cur].m||'')+'</div>'}<button class="b" onclick="qi++;qz()">التالي ➜</button>`;upd()}
function end(){const st=mist==0?3:mist==1?2:1,nx=cur<L.length-1,r0=rank();S.d[cur]=Math.max(S.d[cur]||0,st);S.xp+=st*10;sv();boom(130);snd(523,.15);setTimeout(()=>snd(784,.3),150);if(rank()!=r0)toast('🎖️ رتبة جديدة: '+rank());
A.innerHTML=`<div class="cd" style="text-align:center"><div style="font-size:3rem">${'⭐'.repeat(st)}</div><h2>${nx?'أحسنت! أنهيت المرحلة':'🏆 أنت الآن خبير Purine & Pyrimidine!'}</h2><p>🎖️ ${rank()} · ⚡ ${S.xp} XP</p>${nx?`<button class="b" onclick="lvl(${cur+1})">المرحلة التالية ➜</button> `:''}<button class="g" onclick="lvl(${cur})">🔁 إعادة</button> <button class="g" onclick="home()">🏠 الخريطة</button></div>`}
function fast(){fq=sh(L.flatMap(x=>x.q||[])).slice(0,10);fi=0;fs=0;cb=0;fn()}
function fn(){clearInterval(tm);if(fi>=fq.length){S.xp+=fs*5;sv();boom(100);A.innerHTML=`<div class="cd" style="text-align:center"><div style="font-size:3rem">⚡</div><h2>النتيجة ${fs}/${fq.length}</h2><p>+${fs*5} XP · 🎖️ ${rank()}</p><button class="b" onclick="fast()">🔁 مرة أخرى</button> <button class="g" onclick="home()">🏠</button></div>`;return}
const q=fq[fi];ft=Math.random()<.5;const o=ft?q[1]:rnd(q.slice(2));
A.innerHTML=`<div class="top"><button class="g" onclick="home()">🏠</button><b>⚡ ${fi+1}/${fq.length}</b><span>🔥 ${cb}</span></div><div class="cd" style="text-align:center"><p class="mu">${fx(q[0].replace(/^@\w+\|/,''))}</p><h2 dir="auto">${o}</h2></div><div class="tf"><button onclick="fz(1)">✅ صح</button><button onclick="fz(0)">❌ خطأ</button></div><div id="fb" style="text-align:center"></div>`;}
function fz(v){clearInterval(tm);document.querySelectorAll('.tf button').forEach(b=>b.disabled=1);const ok=v===(ft?1:0);
if(ok){fs++;cb++;ding();if(cb==3)toast('🔥 كومبو ×3!')}else{cb=0;buzz()}
G('fb').innerHTML=ok?rnd(OKL):'الإجابة الصحيحة: '+(ft?'صح ✅':'خطأ ❌');setTimeout(()=>{fi++;fn()},ok?600:1500)}
const fx=s=>s.replace(/[A-Za-zβ0-9][^\u0600-\u06FF<>]*→[^\u0600-\u06FF<>]*/g,m=>'<bdi dir="ltr">'+m.trim()+'</bdi> ');
document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;const k=e.key,o=[...document.querySelectorAll('.op:not(:disabled),.tf button:not(:disabled)')];if(/^[1-4]$/.test(k)&&o[k-1]){o[k-1].click();e.preventDefault()}else if(k=='Enter'){const n=document.querySelector('#fb .b');if(n){n.click();e.preventDefault()}}});
home();
</script></body></html>
